name: Release

# Publishing is a tag push, so the thing that ships and the thing that is
# tagged cannot disagree. Everything before this — the version bump, the
# CHANGELOG entry, `npm run smoke` — is the release ritual in README's
# Development section, and stays on a person's machine: `smoke` installs from
# the registry, and CLAUDE.md keeps the network out of CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # creates the GitHub Release
  id-token: write # the whole of the npm credential — see the publish step

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same checks CI runs on every push, repeated here because a tag can
      # be pushed at a commit CI never saw.
      - run: npm run typecheck
      - run: npm test

      # `build` also writes dist/THIRD-PARTY-NOTICES.md and runs the bundle
      # assertions, so a bundle that lost the inlined wasm, reached Cesium from
      # the Worker realm, or shipped without notices fails here rather than
      # after publishing.
      - run: npm run build

      - name: Refuse a tag that does not match the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      # No token, by design. The registry trusts this repository's release.yml
      # directly (npm calls it a trusted publisher), so the credential is a
      # short-lived OIDC assertion minted per run by the `id-token: write`
      # permission above, and there is no long-lived secret to leak or let
      # expire. Provenance needs no flag on this path: npm attests every
      # publish it accepts over OIDC from a public repository.
      #
      # If npm ever answers this with a 404 or a permissions error, the trusted
      # publisher entry and this file have drifted — it pins the workflow by
      # filename, so renaming this file silently revokes the trust.
      #
      # The OIDC exchange needs npm 11.5.1 or later, which is why this job is
      # not free to move back down a Node line: 24 bundles npm 11.19, and 22
      # bundles npm 10.
      - run: npm publish --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
