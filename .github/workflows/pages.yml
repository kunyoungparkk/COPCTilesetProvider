name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The demo streams the public Autzen file cross-origin, straight from its own
# bucket. It used to be copied into this artifact instead: the library refused
# a response whose Content-Range it could not read, the browser hides that
# header unless the server exposes it, and that bucket does not. Decision 4 now
# accepts such a response on its status and body length, so the copy is gone —
# with it an 81 MB download per deploy, and a first load that failed because
# Pages could not answer a Range for an object its CDN had not cached yet.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Inject the Cesium ion token
        env:
          TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CESIUM_ION_TOKEN secret. The demo will use Natural Earth II."
            exit 0
          fi
          PAGE=examples/index.html
          grep -q "window.CESIUM_ION_TOKEN = ''" "$PAGE" \
            || { echo "token placeholder missing from $PAGE"; exit 1; }
          sed -i "s|window.CESIUM_ION_TOKEN = ''|window.CESIUM_ION_TOKEN = '$TOKEN'|" "$PAGE"
          grep -q "window.CESIUM_ION_TOKEN = ''" "$PAGE" \
            && { echo "substitution did not take"; exit 1; }
          echo "ion token injected"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: examples
      - id: deploy
        uses: actions/deploy-pages@v4
