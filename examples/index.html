<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>copc-tileset-provider — live demo</title>
    <link
      rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css"
    />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; color: #e6e6e6; }
      #globe { position: absolute; inset: 0; }
      #stats {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        max-width: min(420px, calc(100vw - 24px));
        padding: 9px 11px; border-radius: 6px;
        background: rgba(13, 13, 15, 0.86); backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        white-space: pre-wrap; word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; line-height: 1.6;
      }
      #stats.error { border-color: #a3352f; color: #ffb4ae; }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <div id="stats"></div>

    <!-- Where Cesium finds its own Workers, wasm and Assets/. The IIFE build
         infers this from the `<script>` tag that loaded it; an ES module has no
         such tag, so it has to be said. -->
    <script>
      window.CESIUM_BASE_URL =
        'https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/';
    </script>
    <!-- Rewritten at deploy time from the CESIUM_ION_TOKEN repository secret
         (.github/workflows/pages.yml). Empty here on purpose: a Cesium ion
         token is a public, client-side value, but keeping it out of git means
         rotating it costs a secret change rather than a commit. With it empty
         — every local run — the demo uses the imagery bundled into Cesium
         itself and never touches ion. -->
    <script>window.CESIUM_ION_TOKEN = '';</script>
    <!-- One Cesium, reached by one specifier. The library imports `cesium` too,
         and `?external=cesium` keeps it a bare import, so it resolves through
         this same entry: two copies of the engine would make `provider.tileset`
         a Cesium3DTileset from the wrong one, and `scene.primitives.add` fails
         on a class identity check. -->
    <script type="importmap">
      {
        "imports": {
          "cesium": "https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/index.js",
          "copc-tileset-provider": "https://esm.sh/copc-tileset-provider@0.2.0?external=cesium"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
